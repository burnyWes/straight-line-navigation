name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Bewusst minimal und explizit. Der Trigger ist "push auf main" - dorthin kann
# nur der Eigentümer schreiben. Niemals pull_request_target verwenden: Dieser
# Trigger gäbe fremdem PR-Code Schreibrechte und Zugriff auf Secrets.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typen prüfen
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Bauen
        run: npm run build

      - name: Spike mit ausliefern
        # Die Messseite bleibt unter /spike/ erreichbar, damit die offenen
        # Messfragen aus docs/design.md weiter geprüft werden können.
        run: cp -r spike dist/spike

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
